version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: nodejs
    ports:
      - "5432:5432"      # ✅ CORRECT: this must be at the same level as environment
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 12345
      DB_DATABASE: nodejs
      NODE_ENV: development
    command: sh -c "npm run build && npm start"

volumes:
  pgdata:
